<body><div class="shell">
<aside class="side"><div class="brand"><span class="logo">V</span>Vitalog</div><div class="nav-label">MENU</div><nav class="nav" aria-label="주 메뉴"><button class="active" data-page="home"><span class="ico">⌂</span>홈</button><button data-page="care"><span class="ico">♡</span>데일리 케어</button><button data-page="calendar"><span class="ico">▦</span>캘린더</button><button data-page="report"><span class="ico">▤</span>주간 리포트</button></nav><div class="profile"><div class="avatar" id="sidebarAvatar">민</div><div><b id="sidebarName">김민지</b><small>건강 목표를 이어가요</small></div></div></aside>
<main class="main"><header class="top"><div class="mobile-head-brand"><button class="iconbtn backbtn" id="backButton" aria-label="이전 화면으로">‹</button><div class="brandmobile" id="homeBrand"><span class="logo">V</span>Vitalog</div></div><div class="crumb"><span id="crumb">홈</span>　/　나의 건강</div><div class="top-actions"><button class="iconbtn" id="theme" aria-label="화면 테마 전환">☾</button><button class="iconbtn" id="notify" aria-label="알림">♧</button><button class="avatar profile-trigger" id="topProfileAvatar" data-go="profile" aria-label="프로필 화면 열기">민</button></div></header><div class="page" id="page"></div></main>
<nav class="bottom" aria-label="모바일 메뉴"><button class="active" data-page="home"><span>⌂</span>홈</button><button data-page="care"><span>♡</span>케어</button><button data-page="report"><span>▤</span>리포트</button><button data-page="calendar"><span>▦</span>기록</button><button data-page="settings"><span>⚙</span>설정</button></nav></div>
<div class="modalbg" id="modalbg"><form class="modal" id="recordForm"><h2>건강 기록 추가</h2><p>오늘의 건강 기록을 간단히 남겨보세요.</p><label for="type">기록 유형</label><select id="type"><option>식단</option><option>운동</option><option>수면</option><option>컨디션</option></select><label for="record">내용</label><input id="record" required placeholder="예: 점심 식사 기록"><div class="modalactions"><button type="button" class="btn" id="cancel">취소</button><button class="btn primary">저장</button></div></form></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];let page='home',historyStack=[],month=new Date(),selected=new Date(),records={},datePicked=false,profileEditing=false,profileInfo=(()=>{try{const saved=JSON.parse(localStorage.getItem('vitalog-profile-info'));if(saved)return Object.assign({name:'김민지',weight:'69.5',height:'172',weeklyGoal:3},saved);const body=JSON.parse(localStorage.getItem('vitalog-body-info'))||{};return{name:'김민지',weight:body.weight||'69.5',height:body.height||'172',weeklyGoal:3}}catch{return{name:'김민지',weight:'69.5',height:'172',weeklyGoal:3}}})();const tasks=[{name:'식단 기록',desc:'아침 식사 · 08:30',icon:'🥗',cls:'food',done:true},{name:'가벼운 운동',desc:'30분 걷기',icon:'🏃',done:true},{name:'수면 기록',desc:'어제 수면 시간 입력',icon:'🌙',cls:'sleep',done:false}];const weekdays=['일','월','화','수','목','금','토'];function dateText(d,opt={month:'long',day:'numeric',weekday:'long'}){return new Intl.DateTimeFormat('ko-KR',opt).format(d)}function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}function task(t,i){return `<div class="task ${t.done?'done':''}"><span class="taskicon ${t.cls||''}">${t.icon}</span><span class="taskcopy"><b>${t.name}</b><small>${t.desc}</small></span><button class="taskbtn" data-task="${tasks.indexOf(t)}">${t.done?'✓ 완료':'＋ 기록'}</button></div>`}function percent(){return Math.round(tasks.filter(t=>t.done).length/tasks.length*100)}function header(k,title,desc,right){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${right||''}</div>`}
function home(){return `${header('MY HEALTH','오늘도 건강한 하루예요, '+esc(profileInfo.name)+'님','작은 기록이 모여 나만의 건강 흐름을 만들어요.',`<div class="date">${dateText(new Date(),{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div>`)}<div class="cols"><div class="stack"><div class="card welcome"><div class="welcome-in"><div><span style="font-size:10px;color:#dceaff">오늘의 건강 요약</span><h2>좋은 흐름을 이어가고 있어요</h2><p>오늘 목표 4개 중 2개를 완료했어요.</p></div><div class="scorebubble">82점</div></div></div><div class="card"><div class="headrow"><b class="ctitle">오늘의 활동</b><button class="link" data-go="report">리포트 보기 ›</button></div><div class="metrics"><div class="metric"><i>🏃</i><small>운동 시간</small><b>32분</b><em>목표까지 18분</em></div><div class="metric"><i>🥗</i><small>식단 기록</small><b>2회</b><em>어제보다 +1회</em></div><div class="metric"><i>🌙</i><small>수면 시간</small><b>7.2시간</b><em>목표 달성</em></div></div></div>${weatherCard()}<div class="card"><div class="headrow"><b class="ctitle">오늘의 추천 루틴</b><button class="link" data-go="care">루틴 확인 ›</button></div><div class="tasks">${tasks.filter(t=>!t.done).concat(tasks.filter(t=>t.done)).slice(0,2).map(task).join('')}</div></div></div><div class="stack sidecards"><div class="card ringrow"><div><span class="pill">DAILY CARE</span><b style="display:block;margin:8px 0 4px">오늘의 케어</b><small class="muted">${tasks.filter(t=>t.done).length} / 3개 루틴 완료</small><br><button class="link" data-go="care">케어 화면 보기 ›</button></div><div class="ring" style="--pct:${percent()}"><span>${percent()}<small>%</small></span></div></div><div class="card"><div class="headrow"><b class="ctitle">이번 주 목표</b><span class="pill">진행 중</span></div><b style="font-size:18px">2 <small class="muted">/ 3회 운동</small></b><div class="progress"><i style="width:66%"></i></div><small class="muted">목표까지 한 번 남았어요</small></div><div class="card"><div class="headrow"><b class="ctitle">빠른 기록</b><small class="muted">탭해서 추가</small></div>${quick()}</div></div></div>`}
function quick(){return `<div class="quick"><button data-add="식단"><span>🥗</span><small>식단</small></button><button data-add="운동"><span>🏃</span><small>운동</small></button><button data-add="수면"><span>🌙</span><small>수면</small></button><button data-add="컨디션"><span>💙</span><small>컨디션</small></button></div>`}
function weatherAdvice(w){const code=Number(w.code),temp=Number(w.temperature),wind=Number(w.wind),rain=Number(w.precipitation)||0,thunder=[95,96,99].includes(code),snow=[71,73,75,77,85,86].includes(code),rainCode=[51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code),wet=rain>0||rainCode||thunder;let condition=code===0?'맑음':[1,2].includes(code)?'구름 조금':code===3?'흐림':[45,48].includes(code)?'안개':snow?'눈':thunder?'뇌우':wet?'비':'현재 날씨';if(snow)return{condition,exercise:'미끄럼 위험을 피해 실내 스트레칭이나 가벼운 근력 운동을 해보세요.',meal:'따뜻한 국물과 단백질·채소를 곁들인 식사를 추천해요.'};if(thunder)return{condition,exercise:'천둥·번개가 예상돼요. 외출 대신 실내에서 가볍게 움직여 보세요.',meal:'수분을 충분히 곁들인 균형 잡힌 식사를 추천해요.'};if(wet)return{condition,exercise:'비가 와요. 실내 스트레칭이나 홈트레이닝 15분을 추천해요.',meal:'따뜻한 국물과 채소, 단백질을 곁들여 보세요.'};if(temp>=30)return{condition,exercise:'더운 날씨예요. 실내나 그늘에서 무리 없이 운동하고 수분을 챙겨요.',meal:'수분이 많은 과일과 물을 곁들인 식사를 추천해요.'};if(temp>=28)return{condition,exercise:'더운 시간대를 피해 실내 운동이나 그늘 산책을 해보세요.',meal:'물과 제철 과일을 곁들여 수분을 보충해요.'};if(temp<=5)return{condition,exercise:'추운 날씨예요. 실내에서 몸을 충분히 풀고 운동해요.',meal:'따뜻한 음식과 단백질을 포함한 식사를 추천해요.'};if(wind>=35)return{condition,exercise:'바람이 강해요. 실내 걷기나 가벼운 근력 운동을 추천해요.',meal:'채소와 단백질을 곁들인 균형 잡힌 식사를 해보세요.'};return{condition,exercise:'날씨가 괜찮아요. 가볍게 20분 산책해 보세요.',meal:'제철 채소와 단백질을 골고루 곁들인 식사를 추천해요.'}}
function weatherCard(){if(weatherLoading)return '<div class="card weather-card"><div class="headrow"><b class="ctitle">실시간 날씨 추천</b><span class="pill">불러오는 중</span></div><small class="muted">현재 위치의 날씨를 확인하고 있어요.</small></div>';if(!weatherData)return '<div class="card weather-card"><div class="headrow"><div><b class="ctitle">실시간 날씨 추천</b><div class="muted" style="margin-top:4px">현재 날씨에 맞춰 운동과 식사를 추천해요.</div></div><button class="btn primary" data-weather-load>날씨 불러오기</button></div><small class="weather-note">'+(weatherError?esc(weatherError):'버튼을 누르면 위치 권한을 요청해요. 위치는 날씨 확인에만 사용합니다.')+'</small></div>';const a=weatherAdvice(weatherData);return '<div class="card weather-card"><div class="headrow"><div><b class="ctitle">현재 위치 · '+a.condition+'</b><div class="muted" style="margin-top:4px">'+Math.round(weatherData.temperature)+'°C · 습도 '+Math.round(weatherData.humidity)+'% · 바람 '+Math.round(weatherData.wind)+' km/h</div></div><button class="btn" data-weather-load>새로고침</button></div><div class="weather-recs"><div class="weather-rec"><div><span>🏃</span><b>운동</b></div><p>'+a.exercise+'</p></div><div class="weather-rec"><div><span>🥗</span><b>식사</b></div><p>'+a.meal+'</p></div></div></div>'}
function loadWeather(){weatherLoading=true;weatherError='';render();if(!navigator.geolocation){weatherLoading=false;weatherError='이 브라우저에서는 현재 위치를 확인할 수 없어요.';render();return}navigator.geolocation.getCurrentPosition(async pos=>{try{const params=new URLSearchParams({latitude:String(pos.coords.latitude),longitude:String(pos.coords.longitude),current:'temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m',timezone:'auto'}),res=await fetch('https://api.open-meteo.com/v1/forecast?'+params.toString());if(!res.ok)throw new Error('weather');const data=await res.json(),c=data.current;if(!c)throw new Error('weather');weatherData={temperature:c.temperature_2m,humidity:c.relative_humidity_2m,precipitation:c.precipitation,code:c.weather_code,wind:c.wind_speed_10m}}catch{weatherError='날씨 정보를 불러오지 못했어요. 다시 시도해 주세요.'}finally{weatherLoading=false;render()}},err=>{weatherError=err.code===1?'위치 권한을 허용하면 현재 날씨를 볼 수 있어요.':'현재 위치를 확인하지 못했어요. 다시 시도해 주세요.';weatherLoading=false;render()},{enableHighAccuracy:false,timeout:12000,maximumAge:600000})}
function care(){return `${header('DAILY CARE','오늘의 케어','루틴을 완료하고 건강 습관을 이어가요.',`<div class="date">${dateText(new Date())}</div>`)}<div class="cols"><div class="stack"><div class="card streak"><div class="streaktop"><span class="flame">🔥</span><div><b>5일 연속 기록 중!</b><small>오늘도 작은 실천을 이어가요</small></div><span class="pill" style="margin-left:auto;background:#fff0df;color:#e87925">STREAK</span></div><div class="streakdays">${['토','일','월','화','수','목','금'].map((d,i)=>`<div><small>${d}</small><b style="${i<5?'background:#f28a32;color:white;border-color:#f28a32':''}">${i<5?'✓':'·'}</b></div>`).join('')}</div></div><div class="card ringrow"><div><b class="ctitle">오늘의 진행률</b><b style="display:block;margin:8px 0">${percent()===100?'오늘 루틴을 모두 완료했어요!':'목표까지 한 걸음!'}</b><small class="muted">${tasks.filter(t=>t.done).length} / 3개 루틴 완료</small></div><div class="ring" style="--pct:${percent()}"><span>${percent()}<small>%</small></span></div></div><div class="card"><div class="headrow"><div><b class="ctitle">오늘의 루틴</b><div class="muted" style="margin-top:4px">완료한 항목을 체크해보세요.</div></div><span class="pill">${tasks.filter(t=>t.done).length} / 3 완료</span></div><div class="tasks">${tasks.map(task).join('')}</div></div></div><div class="stack sidecards"><div class="card"><div class="headrow"><b class="ctitle">이번 주 목표</b><button class="link" data-go="settings">목표 수정</button></div><b style="font-size:20px">2 <small class="muted">/ 3회 운동</small></b><div class="progress"><i style="width:66%"></i></div><small class="muted">운동 한 번 더 하면 달성해요.</small></div><div class="card"><div class="headrow"><b class="ctitle">내 신체 정보</b><button class="link" data-go="settings">수정 ›</button></div><div class="twostats"><div class="stat"><small>⚖️ 체중</small><b>69.5 kg</b></div><div class="stat"><small>📏 키</small><b>172 cm</b></div></div></div><div class="card"><div class="headrow"><b class="ctitle">빠른 기록</b></div>${quick()}</div></div></div>`}
function calendar(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),demoActivity={3:4,7:3,11:2,14:1,18:4,21:3,25:2,28:1};let cells='';for(let i=0;i<35;i++){let day,d,other=false;if(i<first){day=prev-first+i+1;d=new Date(y,m-1,day);other=true}else if(i>=first+n){day=i-first-n+1;d=new Date(y,m+1,day);other=true}else{day=i-first+1;d=new Date(y,m,day)}const count=(records[key(d)]||[]).length,activity=count||(!other?demoActivity[day]||0:0),level=activity>=4?'activity-high':activity===3?'activity-good':activity===2?'activity-medium':activity===1?'activity-low':'',mark=activity>0;cells+=`<button class="datecell ${other?'out':''} ${level} ${key(d)===key(selected)?'sel':''}" data-date="${key(d)}">${day}${mark?'<i class="dot"></i>':''}</button>`}return `${header('YOUR LOG','건강 캘린더','날짜별 기록과 메모를 한눈에 확인해요.',datePicked?'<button class="btn primary" data-open>＋ 기록 추가</button>':'')}<div class="calendarbox"><div class="card"><div class="monthhead"><b>${y}년 ${m+1}월</b><div><button data-month="-1">‹</button> <button data-month="1">›</button></div></div><div class="calgrid">${weekdays.map(d=>`<div class="weekday">${d}</div>`).join('')}${cells}</div><div class="activity-legend" aria-label="활동량 색상 안내"><span class="legend-title">활동량</span><span class="legend-item"><i class="legend-swatch activity-high"></i>많음</span><span class="legend-item"><i class="legend-swatch activity-good"></i>양호</span><span class="legend-item"><i class="legend-swatch activity-medium"></i>보통</span><span class="legend-item"><i class="legend-swatch activity-low"></i>적음</span></div></div><div class="card"><div class="headrow"><div><b class="ctitle">${dateText(selected,{year:'numeric',month:'long',day:'numeric'})}</b><div class="muted" style="margin-top:4px">선택한 날짜의 건강 기록</div></div><span class="pill">${key(selected)===key(new Date())?'오늘':'기록'}</span></div>${(records[key(selected)]||[]).length?(records[key(selected)]||[]).map(r=>`<div class="task"><span class="taskicon">${r.type==='식단'?'🥗':r.type==='운동'?'🏃':r.type==='수면'?'🌙':'💙'}</span><span class="taskcopy"><b>${esc(r.type)}</b><small>${esc(r.text)}</small></span></div>`).join(''):`<p class="muted" style="padding:16px 0">이 날짜에 등록된 기록이 없어요.</p>`}${datePicked?'<button class="btn primary selected-record-add" data-open>＋ 선택한 날짜에 기록 추가</button>':''}</div></div>`}
function report(){const vals=[43,76,58,91,65,82,50];return `${header('HEALTH INSIGHTS','주간 리포트','꾸준히 쌓인 기록에서 건강 흐름을 찾아봐요.',`<select class="select" id="period"><option>이번 주</option><option>이번 달</option></select>`)}<div class="cols"><div class="stack"><div class="card welcome"><small style="color:#dceaff">건강 신호등 점수</small><div class="welcome-in" style="margin-top:12px"><div style="font-size:44px;font-weight:800">82<small style="font-size:13px"> 점</small></div><span style="font-size:10px;text-align:right;line-height:1.7">지난주보다<br><b>＋8점 상승</b></span></div></div><div class="vital-section"><div class="card vital-heart"><div><div class="vital-kicker">평균 심박수</div><div class="vital-number">72 <small>BPM</small></div></div><svg class="vital-spark" viewBox="0 0 220 58" role="img" aria-label="심박수 변화 그래프"><path d="M0 31 C15 31 16 22 29 22 S45 40 58 34 72 12 83 18 96 44 108 34 124 13 136 21 151 40 164 31 179 18 191 24 206 34 220 26"/></svg></div><div class="vital-pair"><div class="card vital-card"><span class="vital-icon steps-icon">👣</span><div><div class="vital-kicker">일평균 걸음 수</div><div class="vital-number">6,842 <small>걸음</small></div></div></div><div class="card vital-card"><span class="vital-icon water-icon">💧</span><div><div class="vital-kicker">일평균 물 섭취량</div><div class="vital-number">1.8 <small>L</small></div></div></div></div></div><div class="card"><div class="headrow"><div><b class="ctitle">요일별 활동량</b><div class="muted" style="margin-top:4px">운동 시간 · 분</div></div><span class="pill">이번 주</span></div><div class="chart">${vals.map((v,i)=>`<div class="barcol ${i===6?'today':''}"><small class="barval">${v}</small><i class="bar" style="--h:${v}%"></i></div>`).join('')}</div><div class="days">${['토','일','월','화','수','목','금'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="card"><div class="insight"><b>이번 주 발견</b>운동한 날에는 컨디션 기록도 더 좋아요. 지금의 리듬을 이어가 보세요.</div></div></div><div class="stack sidecards"><div class="card"><div class="headrow"><b class="ctitle">이번 주 한눈에 보기</b><span class="pill">좋은 흐름</span></div><div class="twostats"><div class="stat"><small>🏃 운동 시간</small><b>2시간 48분</b></div><div class="stat"><small>✍️ 기록한 날</small><b>5일</b></div><div class="stat"><small>🌙 평균 수면</small><b>7시간 12분</b></div><div class="stat"><small>🥗 식단 기록</small><b>11회</b></div></div></div><div class="card"><div class="headrow"><b class="ctitle">주간 목표</b><button class="link" data-go="care">케어 보기 ›</button></div><b style="font-size:20px">2 <small class="muted">/ 3회 운동</small></b><div class="progress"><i style="width:66%"></i></div></div></div></div>`}
function settings(){
return header('PREFERENCES','설정','계정과 앱 환경을 관리해요.')+'<div class="settings"><div class="card"><div class="headrow"><b class="ctitle">계정 관리</b><span class="pill">내 계정</span></div><div class="setting"><div><b>계정 정보</b><small>이름과 건강 목표를 확인하고 수정해요.</small></div><button class="btn" data-go="profile">프로필 관리</button></div><div class="setting"><div><b>로그인 및 보안</b><small>로그인 계정 연결 상태</small></div><span class="pill account-status">미연결</span></div><div class="setting"><div><b>건강 데이터</b><small>프로필과 현재 기록을 파일로 저장해요.</small></div><button class="btn" data-export-data>내보내기</button></div></div><div class="card"><div class="headrow"><b class="ctitle">화면 및 알림</b></div><div class="setting"><div><b>다크 모드</b><small>어두운 화면 테마</small></div><button class="switch" role="switch" aria-checked="false" data-switch="dark"></button></div><div class="setting"><div><b>건강 루틴 알림</b><small>매일 추천 알림 받기</small></div><button class="switch" role="switch" aria-checked="true" data-switch="alerts"></button></div><div class="setting"><div><b>언어</b><small>앱 표시 언어</small></div><select class="select"><option>한국어</option><option>English</option></select></div></div></div>';
}function profile(){
const name=String(profileInfo.name||'김민지').trim()||'김민지',initial=esc(name.slice(0,1)),safeName=esc(name),weight=esc(profileInfo.weight),height=esc(profileInfo.height),goal=Math.max(2,Math.min(5,Number(profileInfo.weeklyGoal)||3)),done=2,pct=Math.min(100,Math.round(done/goal*100));
const right=profileEditing?'<div class="profile-page-actions"><button class="iconbtn" data-cancel-profile aria-label="수정 취소">×</button><button class="iconbtn profile-edit-trigger" data-save-profile aria-label="프로필 저장">✓</button></div>':'<button class="iconbtn profile-edit-trigger" data-edit-profile aria-label="프로필 전체 수정">✎</button>';

const heightField=profileEditing?'<div class="profile-value-edit"><input class="profile-inline-measure" id="profileHeight" type="number" min="30" max="260" step="1" value="'+height+'"><span>cm</span></div>':'<b>'+height+' cm</b>';

const goalField=profileEditing?'<select class="profile-inline-goal" id="profileGoal"><option value="2"'+(goal===2?' selected':'')+'>주 2회</option><option value="3"'+(goal===3?' selected':'')+'>주 3회</option><option value="4"'+(goal===4?' selected':'')+'>주 4회</option><option value="5"'+(goal===5?' selected':'')+'>주 5회</option></select>':'/ '+goal+'회 운동';
const goalCard='<div class="card"><div class="headrow"><b class="ctitle">주간 운동 목표</b><span class="pill">'+(done>=goal?'목표 달성':'진행 중')+'</span></div><b style="font-size:20px">'+done+' <small class="muted">'+goalField+'</small></b><div class="progress"><i style="width:'+pct+'%"></i></div><small class="muted">'+(done>=goal?'이번 주 목표를 달성했어요.':'목표까지 '+(goal-done)+'번 남았어요.')+'</small></div>';
return header('MY PROFILE','프로필','건강 정보와 목표를 확인해요.',right)+'<div class="profile-grid">'+hero+bodyCard+goalCard+'</div>'}
function navigate(next){if(next===page)return;historyStack.push(page);page=next;if(page!=='profile')profileEditing=false;render();window.scrollTo(0,0)}function goBack(){page=historyStack.pop()||'home';profileEditing=false;render();window.scrollTo(0,0)}function render(){const names={home:'홈',care:'데일리 케어',calendar:'캘린더',report:'주간 리포트',settings:'설정',profile:'프로필'};$('#crumb').textContent=names[page];$('#page').innerHTML=({home,care,calendar,report,settings,profile}[page])();const displayName=String(profileInfo.name||'김민지').trim()||'김민지',initial=displayName.slice(0,1);if($('#sidebarName'))$('#sidebarName').textContent=displayName;if($('#sidebarAvatar'))$('#sidebarAvatar').textContent=initial;if($('#topProfileAvatar')){$('#topProfileAvatar').textContent=page==='profile'?'←':initial;$('#topProfileAvatar').setAttribute('aria-label',page==='profile'?'이전 화면으로 돌아가기':displayName+' 프로필 화면 열기')}all('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.onclick=e=>{e.preventDefault();navigate(b.dataset.page)}})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openModal(type){$('#type').value=type||'식단';$('#modalbg').classList.add('open');$('#record').focus()}function closeModal(){$('#modalbg').classList.remove('open')}
document.addEventListener('click',e=>{const editProfile=e.target.closest('[data-edit-profile]');if(editProfile){profileEditing=true;render();$('#profileName')?.focus();return}const cancelProfile=e.target.closest('[data-cancel-profile]');if(cancelProfile){profileEditing=false;render();return}const saveProfile=e.target.closest('[data-save-profile]');if(saveProfile){const name=$('#profileName').value.trim(),weight=Number($('#profileWeight').value),height=Number($('#profileHeight').value),weeklyGoal=Number($('#profileGoal').value);if(!name||!Number.isFinite(weight)||weight<1||weight>400||!Number.isFinite(height)||height<30||height>260||![2,3,4,5].includes(weeklyGoal)){toast('프로필 정보를 확인해 주세요.');return}profileInfo={name,weight:String(weight),height:String(height),weeklyGoal};try{localStorage.setItem('vitalog-profile-info',JSON.stringify(profileInfo));localStorage.setItem('vitalog-body-info',JSON.stringify({weight:profileInfo.weight,height:profileInfo.height}))}catch{}profileEditing=false;render();toast('프로필 정보를 저장했어요.');return}const go=e.target.closest('[data-go]');if(go){if(go.dataset.go==='profile'){if(page==='profile')goBack();else navigate('profile')}else navigate(go.dataset.go);return}const weatherBtn=e.target.closest('[data-weather-load]');if(weatherBtn){loadWeather();return}const exportData=e.target.closest('[data-export-data]');if(exportData){const blob=new Blob([JSON.stringify({profile:profileInfo,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='vitalog-data.json';link.click();URL.revokeObjectURL(url);toast('건강 데이터를 내보냈어요.');return}const taskBtn=e.target.closest('[data-task]');if(taskBtn){const t=tasks[Number(taskBtn.dataset.task)];t.done=!t.done;render();return}const add=e.target.closest('[data-add]');if(add){openModal(add.dataset.add);return}if(e.target.closest('[data-open]')){openModal();return}const monthBtn=e.target.closest('[data-month]');if(monthBtn){month=new Date(month.getFullYear(),month.getMonth()+Number(monthBtn.dataset.month),1);render();return}const dateBtn=e.target.closest('[data-date]');if(dateBtn){const [y,m,d]=dateBtn.dataset.date.split('-').map(Number);selected=new Date(y,m-1,d);datePicked=true;render();window.scrollTo({top:0,behavior:'smooth'});return}const sw=e.target.closest('[data-switch]');if(sw){const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',String(on));if(sw.dataset.switch==='dark')document.body.classList.toggle('dark',on);else toast(on?'루틴 알림을 켰어요.':'루틴 알림을 껐어요.')}});
$('#theme').addEventListener('click',()=>{const on=document.body.classList.toggle('dark');$('#theme').textContent=on?'☀':'☾'});$('#notify').addEventListener('click',()=>toast('새로운 알림이 없어요.'));$('#cancel').addEventListener('click',closeModal);$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});$('#recordForm').addEventListener('submit',e=>{e.preventDefault();const k=key(selected);(records[k]??=[]).push({type:$('#type').value,text:$('#record').value.trim()});closeModal();render();toast('건강 기록을 저장했어요.')});$('#backButton').addEventListener('click',goBack);$('#homeBrand').addEventListener('click',()=>navigate('home'));render();
})();
